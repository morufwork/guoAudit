# Conventional benchmark reproduction.

seed: 42
n_folds: 5

# Symmetric pair-fusion applied to protein-level features before classification
#. See src/features/pair_fusion.py.
fusion: combined

representations:
  - aac
  - ctd
  - aac_ctd
  - physicochemical

models:
  logistic_regression:
    max_iter: 2000
  random_forest:
    n_estimators: 300
    n_jobs: -1
  xgboost:
    n_estimators: 300
    eval_metric: logloss
  mlp:
    hidden_layer_sizes: [128, 64]
    max_iter: 500
    early_stopping: true
